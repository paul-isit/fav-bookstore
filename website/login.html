<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Favourite Books</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#home">Favourite Books</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html#catalogue">Catalogue</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <span id="session-status" class="session-status" hidden></span>
      <button id="sign-out-button" class="ghost-button compact-button" type="button" hidden>Sign out</button>
      <a id="login-link" href="login.html">Login</a>
      <a id="signup-link" class="button-link" href="signup.html">Sign up</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-copy">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <p class="muted">Use your customer account or continue as a guest shopper.</p>
    </section>

    <form id="login-form" class="form-panel auth-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" required />

      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="Password" required />

      <button class="button" type="submit">Login</button>
      <button id="guest-login-button" class="ghost-button" type="button">Continue as guest</button>
      <p id="login-message" class="muted"></p>
      <p class="muted">No account yet? <a href="signup.html">Sign up here</a>.</p>
    </form>
  </main>

  <script src="account.js"></script>
</body>
</html>
